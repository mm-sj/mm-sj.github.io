name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 시안 미리보기: lobby 브랜치를 따로 빌드해서 /preview/ 에 올린다 (브랜치가 없으면 건너뜀)
      - uses: actions/checkout@v4
        continue-on-error: true
        id: lobby
        with:
          ref: lobby
          path: _lobby
      - if: steps.lobby.outcome == 'success'
        run: |
          cd _lobby && npm ci && npm run build
          rm -rf ../dist/preview && cp -r dist ../dist/preview
          sed -i 's#<head>#<head><meta name="robots" content="noindex">#' ../dist/preview/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
