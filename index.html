    <meta charset="UTF-8" />

    <meta property="og:title" content="오창민 — 기획한 흐름을 직접 화면으로 만들어 본 사람" />
    <meta property="og:description" content="데이터 냉장고 · DocQ · Would You Draw · Jabis — 수상 프로젝트 4개" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,200..300,0,0&display=block" />
    <style>
      /* 로딩 화면 — JS를 받기 전부터 바로 보이고, 3D 준비(셰이더 컴파일)가 끝나면 사라진다 */
      #boot { position: fixed; inset: 0; z-index: 999; display: grid; place-content: center; justify-items: center; gap: 14px;
        background: #ecebe7; color: #1f1e1c; font: 500 12px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.14em;
        transition: opacity 0.6s ease, visibility 0.6s; }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot .bar { position: relative; width: 160px; height: 3px; border-radius: 3px; background: #dcd8d0; overflow: hidden; }
      #boot .bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: #1f1e1c; animation: boot 1.1s ease-in-out infinite; }
      #boot small { color: #8a857d; letter-spacing: 0.08em; font-size: 11px; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <span>OH CHANGMIN — PORTFOLIO</span>
      <span class="bar"></span>
      <small>모형을 세우는 중</small>
    </div>
    <script>
      // 3D가 준비되면 App이 folio:ready를 보낸다. 어떤 이유로든 늦어지면 6초 뒤엔 무조건 걷는다
      (function () {
        var done = function () { var b = document.getElementById('boot'); if (b && !b.classList.contains('done')) { b.classList.add('done'); setTimeout(function () { b.remove() }, 700) } }
        window.addEventListener('folio:ready', done)
        setTimeout(done, 6000)
      })()
    </script>
    <div id="root"></div>
    <!-- 방문 통계 (GoatCounter — 쿠키 없음). mm-sj.goatcounter.com 계정이 있어야 집계된다 -->
    <script data-goatcounter="https://mm-sj.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
