<!doctype html>
<html lang="ko">
  <head>
    <script>
      // 휴대폰(터치 + 작은 화면)은 3D 대신 정적 버전으로. ?3d 를 붙이면 그대로 3D를 본다
      window.__PHONE__ = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820 && !/[?&]3d\b/.test(location.search)
      if (window.__PHONE__) location.replace('./quick/')
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오창민 — Web 3D Frontend</title>
    <meta name="description" content="건축 모형을 만들던 프론트엔드 개발자 오창민의 인터랙티브 포트폴리오" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="오창민 포트폴리오" />
    <meta property="og:url" content="https://mm-sj.github.io/" />
    <meta property="og:title" content="오창민 — 건축을 전공한 프론트엔드 개발자" />
    <meta property="og:description" content="도면이 모형이 되고, 모형이 웹이 되는 인터랙티브 포트폴리오 · DocQ · Would You Draw · Jabis" />
    <meta property="og:image" content="https://mm-sj.github.io/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mm-sj.github.io/og.jpg" />
    <meta name="theme-color" content="#F3F5F4" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <style>
      /* 로딩 화면 — JS를 받기 전부터 바로 보이고, 3D 준비(셰이더 컴파일)가 끝나면 사라진다 */
      #boot { position: fixed; inset: 0; z-index: 999; display: grid; place-content: center; justify-items: center; gap: 14px;
        background: #F3F5F4; color: #16191C; font: 500 12px/1 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.14em;
        transition: opacity 0.6s ease, visibility 0.6s; }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot .bar { position: relative; width: 160px; height: 1px; background: #D5DAD8; overflow: hidden; }
      #boot .bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: #2446D8; animation: boot 1.1s ease-in-out infinite; }
      #boot small { color: #6B737C; letter-spacing: 0.08em; font-size: 11px; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <span>OH CHANGMIN — PORTFOLIO</span>
      <span class="bar"></span>
      <small>도면을 펼치는 중</small>
    </div>
    <script>
      // 3D가 준비되면 App이 folio:ready를 보낸다. 어떤 이유로든 늦어지면 6초 뒤엔 무조건 걷는다
      (function () {
        var done = function () { var b = document.getElementById('boot'); if (b && !b.classList.contains('done')) { b.classList.add('done'); setTimeout(function () { b.remove() }, 700) } }
        window.addEventListener('folio:ready', done)
        setTimeout(done, 6000)
      })()
    </script>
    <div id="root"></div>
    <!-- 방문 통계 (GoatCounter — 쿠키 없음). mm-sj.goatcounter.com 계정이 있어야 집계된다 -->
    <script data-goatcounter="https://mm-sj.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
